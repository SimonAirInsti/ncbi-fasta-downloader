[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncbi-fasta-downloader"
version = "2.0.0"
description = "High-performance NCBI and UniProt protein sequence downloader with batch processing, data integration, and intelligent rate limiting"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Simon Marino", email = "marinoperea98@usal.es"},
]
keywords = [
    "ncbi", "fasta", "genbank", "bioinformatics", "protein",
    "sequences", "download", "batch", "parallel", "uniprot",
    "data-integration", "influenza",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "biopython>=1.79",
    "requests>=2.28.0",
    "colorama>=0.4.4",
    "pandas>=1.5.0",
    "joblib>=1.2.0",
    "tqdm>=4.64.0",
    "numpy>=1.21.0",
    "urllib3>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.8",
    "flake8>=5.0",
    "black>=22.0",
    "bandit>=1.7",
    "safety>=2.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/SimonAirInsti/ncbi-fasta-downloader"
Documentation = "https://github.com/SimonAirInsti/ncbi-fasta-downloader/wiki"
Repository = "https://github.com/SimonAirInsti/ncbi-fasta-downloader"
"Bug Tracker" = "https://github.com/SimonAirInsti/ncbi-fasta-downloader/issues"
Changelog = "https://github.com/SimonAirInsti/ncbi-fasta-downloader/releases"

[project.scripts]
ncbi-downloader = "ncbi_downloader:main"
ncbi-progress = "check_progress:main"
ncbi-integrate = "data_integrator:main"

[tool.setuptools]
py-modules = ["ncbi_downloader", "data_integrator", "check_progress"]

[tool.setuptools.packages.find]
include = ["ncbi_downloader_pkg*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=. --cov-report=term-missing"

[tool.coverage.run]
source = ["."]
omit = ["test_*", "setup.py", "*/__pycache__/*", ".venv/*", "venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
